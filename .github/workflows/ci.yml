name: Verify Mirror Room
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Generate simulation evidence snapshot
        run: npm run evidence
      - name: Upload evidence artifact (uncertified)
        uses: actions/upload-artifact@v4
        with:
          name: phi-bridge-r09-model-evidence
          path: artifacts/phi-bridge-r09-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Run R10 deterministic fault campaigns
        run: npm run campaign
      - name: Upload R10 campaign trace (simulation only)
        uses: actions/upload-artifact@v4
        with:
          name: phi-bridge-r10-simulation-campaigns
          path: artifacts/phi-bridge-r10-campaigns.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify R11 hazard model observations and external evidence gaps
        run: npm run atlas
      - name: Upload R11 hazard atlas (uncertified)
        uses: actions/upload-artifact@v4
        with:
          name: phi-bridge-r11-hazard-atlas
          path: artifacts/phi-bridge-r11-hazard-atlas.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify R12 dependency architecture and independent safety domain
        run: npm run architecture
      - name: Upload R12 systems blueprint (concept only)
        uses: actions/upload-artifact@v4
        with:
          name: phi-bridge-r12-systems-architecture
          path: artifacts/phi-bridge-r12-systems-architecture.json
          if-no-files-found: error
          retention-days: 30
